# Blueprint de Render para el backend de pdfcatalogo (plan GRATUITO).
# Este repositorio ES el backend: no se necesita "rootDir".
# Render → New → Blueprint → seleccionar este repositorio.
# Las variables marcadas con "sync: false" se completan en el panel de Render.
services:
  - type: web
    name: pdfcatalogo-api
    runtime: node
    plan: free
    # npm ci descarga también chrome-headless-shell en .cache/puppeteer (ver .puppeteerrc.cjs)
    buildCommand: npm ci && npm run build && npm run prisma:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
